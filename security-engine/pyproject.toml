[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-engine"
version = "0.1.0"
description = "Motor modular de auditoria de segurança, validação de escopo anti-SSRF, sanitização de evidências e recomendações técnicas do cyber-security-checker."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["security_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
